[{"type":"text","text":"successfully downloaded text file (SHA: 39d7a65a1a6beb925f813e832de7ac0c23117199)"},{"type":"resource","resource":{"uri":"repo://SportGoofy100/micinterart/sha/61a11caa4511096925a7537411bb79ca392ab108/contents/.github/workflows/deploy.yml","mimeType":"text/plain; charset=utf-8","text":"name: Deploy to micinterart.de via FTP\n\non:\n  push:\n    branches:\n      - main\n  workflow_dispatch:\n\njobs:\n  lint-php:\n    name: PHP-Syntaxprüfung\n    runs-on: ubuntu-latest\n    steps:\n      - name: Repository auschecken\n        uses: actions/checkout@v4\n\n      - name: PHP einrichten\n        uses: shivammathur/setup-php@v2\n        with:\n          php-version: '8.2'\n\n      - name: Alle PHP-Dateien auf Syntaxfehler prüfen\n        run: |\n          status=0\n          while IFS= read -r -d '' file; do\n            if ! php -l \"$file\" > /dev/null; then\n              echo \"::error file=$file::PHP-Syntaxfehler\"\n              php -l \"$file\" || true\n              status=1\n            fi\n          done < <(find micinterart-child micinterart-gallery -name '*.php' -print0)\n          exit $status\n\n  deploy-theme:\n    name: Deploy Child-Theme\n    runs-on: ubuntu-latest\n    # Nur deployen, wenn alle PHP-Dateien syntaktisch fehlerfrei sind\n    needs: lint-php\n    steps:\n      - name: Repository auschecken\n        uses: actions/checkout@v4\n\n      - name: Child-Theme per FTP hochladen\n        uses: SamKirkland/FTP-Deploy-Action@v4.3.5\n        with:\n          server: ${{ secrets.FTP_SERVER }}\n          username: ${{ secrets.FTP_USERNAME }}\n          password: ${{ secrets.FTP_PASSWORD }}\n          protocol: ftps\n          local-dir: ./micinterart-child/\n          server-dir: /test.micinterart.de/wp-content/themes/micinterart-child/\n          exclude: |\n            **/.git*\n            **/.git*/**\n            **/.github/**\n\n  deploy-gallery:\n    name: Deploy Gallery-Plugin\n    runs-on: ubuntu-latest\n    # Nacheinander laufen, damit sich die FTP-Syncs nicht überschneiden\n    needs: deploy-theme\n    steps:\n      - name: Repository auschecken\n        uses: actions/checkout@v4\n\n      - name: Gallery-Plugin per FTP hochladen\n        uses: SamKirkland/FTP-Deploy-Action@v4.3.5\n        with:\n          server: ${{ secrets.FTP_SERVER }}\n          username: ${{ secrets.FTP_USERNAME }}\n          password: ${{ secrets.FTP_PASSWORD }}\n          protocol: ftps\n          log-level: verbose\n          local-dir: ./micinterart-gallery/\n          server-dir: /test.micinterart.de/wp-content/plugins/micinterart-gallery/\n          exclude: |\n            **/.git*\n            **/.git*/**\n            **/.github/**\n"}}]